# expect: 3 FLAG
# GDF-010 regression: access_key / private_key / credential were absent from the v1.1
# pattern list entirely — a second miss, independent of the comment-laundering bug.
project:
  name: "fixture"
  intent: "regression fixture — not a real project"
  charter_signed: true
  gdf_version: "1.2"
tracker:
  provider: "jira"
  jira:
    site_url: "https://fixture.atlassian.net"
    project_key: "FIX"
    board_type: "scrum"
    approved_label: "gdf-approved"
  invariants:
    ac_required_at_creation: true
    assignee_only_transitions: true
  statuses:
    todo: "To Do"
    in_progress: "In Progress"
    in_review: "In Review"
    done: "Done"
    blocked_human: "Blocked-Human"
    awaiting_owner: "Awaiting-Owner"
git:
  provider: "github"
  owner: "fixture-owner"
  repo: "fixture-repo"
  trunk: "main"
  merge_method: "squash"
  machine_account: "gdf-bot"
  required_trailers: ["GDF-Agent", "GDF-Task", "GDF-Run"]
  protected_branches_configured: true
quality_gate:
  provider: "ci-native"
  thresholds:
    coverage_min: 80
    duplication_max: 3
    ratings: "A"
security_scans:
  gitleaks: true
  dependency_audit: true
  semgrep: "false"
artifact_store:
  provider: "none"
deploy:
  enabled: "false"
  environments:
    staging:
      auto_deploy_on_trunk: true
    production:
      via: "tag + environment protection"
      required_reviewer: "owner"
  target: "none"
zones:
  blocked_globs:
    - "**/auth/**"
  pii_columns_registry: "n/a"
limits:
  pr_diff_cap_loc: 600
ci_secrets_required:
  - "SONAR_TOKEN"
deploy_access_key = F1XTURE0ACCESS0KEY0CASE0NOTREAL
