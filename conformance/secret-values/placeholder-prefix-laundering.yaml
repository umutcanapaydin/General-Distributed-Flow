# expect: 3 FLAG
# GDF-013 regression (Skeptic re-poll): the placeholder exemption was anchored at the START
# of the value, so a real secret concatenated after a placeholder word evaded detection.
project:
  name: "fixture"
  intent: "regression fixture — not a real project"
  charter_signed: true
  gdf_version: "1.2"
tracker:
  provider: "jira"
  jira:
    site_url: "https://fixture.atlassian.net"
    project_key: "FIX"
    board_type: "scrum"
    approved_label: "gdf-approved"
  invariants:
    ac_required_at_creation: true
    assignee_only_transitions: true
  statuses:
    todo: "To Do"
    in_progress: "In Progress"
    in_review: "In Review"
    done: "Done"
    blocked_human: "Blocked-Human"
    awaiting_owner: "Awaiting-Owner"
git:
  provider: "github"
  owner: "fixture-owner"
  repo: "fixture-repo"
  trunk: "main"
  merge_method: "squash"
  machine_account: "gdf-bot"
  required_trailers: ["GDF-Agent", "GDF-Task", "GDF-Run"]
  protected_branches_configured: true
quality_gate:
  provider: "ci-native"
  thresholds:
    coverage_min: 80
    duplication_max: 3
    ratings: "A"
security_scans:
  gitleaks: true
  dependency_audit: true
  semgrep: "false"
artifact_store:
  provider: "none"
deploy:
  enabled: "false"
  environments:
    staging:
      auto_deploy_on_trunk: true
    production:
      via: "tag + environment protection"
      required_reviewer: "owner"
  target: "none"
zones:
  blocked_globs:
    - "**/auth/**"
  pii_columns_registry: "n/a"
limits:
  pr_diff_cap_loc: 600
ci_secrets_required:
  - "SONAR_TOKEN"
  - "DEPLOY_SSH_KEY"
gitleaks_secret_name: "GITLEAKS_LICENSE"
db_password: "${DB_PASSWORD}"
sonar_token_env: "SONAR_TOKEN"
notes: "never paste an api_key value into this file"
some_api_key: "changeme_F1XTURE0PREFIX0CASE0NOTREAL99"
